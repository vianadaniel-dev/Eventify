server:
  port: 8080

spring:
  application:
    name: Eventify

  datasource:
    url: jdbc:postgresql://localhost:5432/eventify_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # Flyway toma el control total del esquema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Unificamos seeder y jwt bajo el único bloque 'app:'
app:
  seeder:
    enabled: false
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 horas

# Auditoría SQL y trazabilidad de parámetros (TASK 2.4)
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info