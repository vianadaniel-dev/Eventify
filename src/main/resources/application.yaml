server:
  port: 8080

spring:
  application:
    name: Eventify

  datasource:
    url: jdbc:postgresql://localhost:5432/eventify_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Crea y actualiza tablas automáticamente
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  seeder:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always