server:
  port: 8080

spring:
  application:
    name: Eventify

  datasource:
    url: jdbc:postgresql://localhost:5432/eventify_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # Flyway toma el control total del esquema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Desactivamos el seeder en código porque Flyway V3 poblará los +200 registros
app:
  seeder:
    enabled: false

# Auditoría SQL y trazabilidad de parámetros (TASK 2.4)
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info