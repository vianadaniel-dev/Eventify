server:
  port: 8080

spring:
  application:
    name: Eventify

# Control del seeder de datos iniciales en memoria
app:
  seeder:
    enabled: true

# Configuración de Swagger UI / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Configuración de Actuator (Observabilidad y Salud)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always